name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Compile all python files
        run: python -m compileall -q .

      - name: Ruff format check
        run: ruff format --check --exclude upload_photo .

      - name: Ruff lint check
        run: ruff check --exclude upload_photo .

      - name: Run tests (services mocked by defaults/env)
        env:
          COMFYUI_URL: "http://127.0.0.1:1"
          LM_STUDIO_BASE_URL: "http://127.0.0.1:1/v1"
          LM_STUDIO_API_KEY: "ci-test-key"
          LM_STUDIO_MODEL: "qwen/qwen3.5-9b"
          LM_STUDIO_PRESET: "@local:no-thinking"
          LM_STUDIO_PARALLEL_WORKERS: "1"
          QUOTES_FILE_PATH: "/tmp/quotes.json"
        run: pytest -q

      - name: Dependency vulnerability checks
        run: |
          pip-audit -r requirements-lock.txt
          pip-audit
