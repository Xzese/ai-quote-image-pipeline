[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quote-image-pipeline"
version = "0.1.0"
description = "A local pipeline for turning quotes into generated social images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools]
# The publishing dependency remains an independently maintained Git submodule.
packages = ["quote_image_generator", "upload_photo"]
include-package-data = false

[tool.setuptools.package-dir]
quote_image_generator = "src/quote_image_generator"
upload_photo = "upload_photo"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
